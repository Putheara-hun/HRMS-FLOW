<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HRMS Schema Reference</title>
<style>
  :root{
    --bg:#f6f8fc; --panel:#fff; --ink:#16202e; --muted:#5d6e85; --faint:#8798ad;
    --line:#dde5f0; --line-soft:#eef3f9; --accent:#3b6fd4; --accent-soft:#e8f0fe;
    --pk:#b4661b; --pk-bg:#fbeedd; --fk:#2f6fd0; --fk-bg:#e7f0fd;
    --ok:#1f7a4d; --ok-bg:#e3f4ea; --shadow:0 1px 2px rgba(16,32,56,.05),0 8px 24px -14px rgba(16,32,56,.2);
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --bg:#0e1420; --panel:#151d2b; --ink:#e6ecf5; --muted:#9fb0c6; --faint:#78889e;
    --line:#263345; --line-soft:#1b2433; --accent:#6c9bf0; --accent-soft:#1b2940;
    --pk:#e0a05c; --pk-bg:#2b1f12; --fk:#74a6f0; --fk-bg:#16243a;
    --ok:#5cc189; --ok-bg:#12271c; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -14px rgba(0,0,0,.6);
  }}
  :root[data-theme="dark"]{
    --bg:#0e1420; --panel:#151d2b; --ink:#e6ecf5; --muted:#9fb0c6; --faint:#78889e;
    --line:#263345; --line-soft:#1b2433; --accent:#6c9bf0; --accent-soft:#1b2940;
    --pk:#e0a05c; --pk-bg:#2b1f12; --fk:#74a6f0; --fk-bg:#16243a;
    --ok:#5cc189; --ok-bg:#12271c; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -14px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:14.5px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  header{background:linear-gradient(140deg,#1c2e52 0%,#2a4a7f 60%,#2f6fd0 140%); color:#fff; padding:26px 20px 22px}
  header .in{max-width:1480px; margin:0 auto}
  header h1{margin:0 0 4px; font-size:1.35rem; letter-spacing:-.015em}
  header p{margin:0; color:#bcd0ee; font-size:.86rem}
  header .counts{margin-top:14px; display:flex; gap:8px; flex-wrap:wrap; font-size:.75rem}
  header .counts span{background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.16); border-radius:7px; padding:5px 10px}
  header a.back{color:#bcd0ee; font-size:.78rem; text-decoration:none; border-bottom:1px dotted #7f9ec9}
  header a.back:hover{color:#fff}

  .layout{max-width:1480px; margin:0 auto; padding:16px 20px 60px; display:grid; grid-template-columns:302px 1fr; gap:18px; align-items:start}
  @media (max-width:980px){ .layout{grid-template-columns:1fr} .side{position:static !important; max-height:none !important} }

  /* ── sidebar ── */
  .side{position:sticky; top:14px; max-height:calc(100vh - 30px); display:flex; flex-direction:column;
        background:var(--panel); border:1px solid var(--line); border-radius:13px; box-shadow:var(--shadow); overflow:hidden}
  .search{padding:11px; border-bottom:1px solid var(--line)}
  .search input{
    width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:9px;
    background:var(--bg); color:var(--ink); font:inherit; font-size:.86rem;
  }
  .search input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
  .search .hint{font-size:.7rem; color:var(--faint); margin-top:6px}
  .chips{display:flex; flex-wrap:wrap; gap:4px; padding:9px 11px; border-bottom:1px solid var(--line)}
  .chip{
    font:600 .68rem/1 var(--mono); letter-spacing:.05em; padding:5px 7px; border-radius:6px; cursor:pointer;
    border:1px solid var(--line); background:var(--bg); color:var(--muted);
  }
  .chip.on{background:var(--accent); border-color:var(--accent); color:#fff}
  .list{overflow-y:auto; flex:1; padding:6px 0}
  .grp{font:700 .66rem/1 var(--mono); letter-spacing:.09em; color:var(--faint); padding:11px 14px 5px}
  .item{
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    padding:6px 14px; cursor:pointer; font-size:.82rem; border-left:3px solid transparent;
  }
  .item:hover{background:var(--line-soft)}
  .item.on{background:var(--accent-soft); border-left-color:var(--accent); font-weight:600}
  .item .nm{font-family:var(--mono); font-size:.78rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .item .ct{font-size:.68rem; color:var(--faint); flex:none}
  .item.stm .nm{color:var(--faint)}

  /* ── main ── */
  .main{min-width:0}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:13px; box-shadow:var(--shadow); margin-bottom:16px; overflow:hidden}
  .card > h2{
    margin:0; padding:15px 18px; border-bottom:1px solid var(--line); font-size:1.02rem;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .card > h2 .q{font-family:var(--mono); font-size:.95rem}
  .card > h2 small{font-weight:400; color:var(--faint); font-size:.74rem}
  .card .body{padding:0}
  .pad{padding:16px 18px}

  .badge{font:700 .62rem/1 var(--mono); letter-spacing:.06em; border-radius:5px; padding:4px 6px}
  .b-pk{background:var(--pk-bg); color:var(--pk)}
  .b-fk{background:var(--fk-bg); color:var(--fk)}
  .b-stm{background:var(--line-soft); color:var(--faint)}
  .b-ok{background:var(--ok-bg); color:var(--ok)}

  table{width:100%; border-collapse:collapse; font-size:.83rem}
  th{text-align:left; font:700 .66rem/1 ui-sans-serif,system-ui,sans-serif; letter-spacing:.08em; text-transform:uppercase;
     color:var(--faint); padding:9px 12px; border-bottom:1px solid var(--line); background:var(--line-soft)}
  td{padding:7px 12px; border-bottom:1px solid var(--line-soft); vertical-align:top}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover td{background:var(--line-soft)}
  td.col{font-family:var(--mono); font-weight:600; white-space:nowrap}
  td.typ{font-family:var(--mono); color:var(--muted); white-space:nowrap; font-size:.78rem}
  td.ref{font-family:var(--mono); font-size:.78rem; white-space:nowrap}
  td.ref a{color:var(--fk); text-decoration:none; border-bottom:1px dotted var(--fk)}
  td.ref a:hover{background:var(--fk-bg)}
  .nul{color:var(--faint); font-size:.72rem}
  .req{color:var(--ok); font-size:.72rem; font-weight:700}

  pre{
    margin:0; padding:13px 15px; background:var(--line-soft); border:1px solid var(--line);
    border-radius:9px; overflow-x:auto; font:12.5px/1.65 var(--mono); color:var(--ink);
  }
  pre .kw{color:var(--accent); font-weight:600}
  pre .cm{color:var(--faint)}
  .joins{display:grid; gap:11px; padding:16px 18px}
  .join h4{margin:0 0 6px; font-size:.8rem; color:var(--muted); font-weight:600}
  .join h4 b{color:var(--ink); font-family:var(--mono)}

  .empty{padding:60px 20px; text-align:center; color:var(--faint)}
  .empty b{display:block; color:var(--muted); font-size:1rem; margin-bottom:5px}

  .tabs{display:flex; gap:2px; padding:0 18px; border-bottom:1px solid var(--line); background:var(--panel)}
  .tab{padding:11px 13px; font-size:.8rem; font-weight:600; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent}
  .tab:hover{color:var(--ink)}
  .tab.on{color:var(--accent); border-bottom-color:var(--accent)}

  .allrel td{font-family:var(--mono); font-size:.76rem; white-space:nowrap}
  .allrel td.sql{white-space:normal; color:var(--muted)}
  .copy{
    float:right; font:600 .68rem/1 ui-sans-serif,system-ui,sans-serif; cursor:pointer; color:var(--accent);
    background:var(--accent-soft); border:1px solid transparent; border-radius:6px; padding:5px 9px;
  }
  .copy:hover{border-color:var(--accent)}
  @media print{ .side,.search,.chips,.copy,.tabs{display:none} .layout{grid-template-columns:1fr} }
</style>
</head>

K_USER_NCMI_ASIGN_LTR_US","ps":"USP","pt":"USER_NCMI_ASIGN","pc":"LTR_US","rs":"USP","rt":"USRAC","rc":"US_ID","o":1,"d":"NO ACTION"},{"fk":"FK_USER_NCMI_ASIGN_TR_US","ps":"USP","pt":"USER_NCMI_ASIGN","pc":"TR_US","rs":"USP","rt":"USRAC","rc":"US_ID","o":1,"d":"NO ACTION"},{"fk":"FK_USER_NCMI_ASIGN_US_ID","ps":"USP","pt":"USER_NCMI_ASIGN","pc":"US_ID","rs":"USP","rt":"USRAC","rc":"US_ID","o":1,"d":"NO ACTION"},{"fk":"FK_UNCMITM_TR_US","ps":"USP","pt":"USER_NCMI_ASIGN_STM","pc":"TR_US","rs":"USP","rt":"USRAC","rc":"US_ID","o":1,"d":"NO ACTION"},{"fk":"FK_USER_NDEFAULT_PMS_LTR_US","ps":"USP","pt":"USER_NDEFAULT_PMS","pc":"LTR_US","rs":"USP","rt":"USRAC","rc":"US_ID","o":1,"d":"NO ACTION"},{"fk":"FK_USER_NDEFAULT_PMS_PMS_ID","ps":"USP","pt":"USER_NDEFAULT_PMS","pc":"PMS_ID","rs":"USP","rt":"PERMISSION","rc":"PMS_ID","o":1,"d":"CASCADE"},{"fk":"FK_USER_NDEFAULT_PMS_TR_US","ps":"USP","pt":"USER_NDEFAULT_PMS","pc":"TR_US","rs":"USP","rt":"USRAC","rc":"US_ID","o":1,"d":"NO ACTION"},{"fk":"FK_USER_NDEFAULT_PMS_US_ID","ps":"USP","pt":"USER_NDEFAULT_PMS","pc":"US_ID","rs":"USP","rt":"USRAC","rc":"US_ID","o":1,"d":"NO ACTION"},{"fk":"FK_USER_NRUL_ASIGN_RUL_ID","ps":"USP","pt":"USER_NRUL_ASIGN","pc":"RUL_ID","rs":"USP","rt":"USRULE","rc":"RUL_ID","o":1,"d":"NO ACTION"},{"fk":"FK_USER_NRUL_ASIGN_US_ID","ps":"USP","pt":"USER_NRUL_ASIGN","pc":"US_ID","rs":"USP","rt":"USRAC","rc":"US_ID","o":1,"d":"NO ACTION"},{"fk":"FK_USRACOTP_US_ID","ps":"USP","pt":"USRACOTP","pc":"US_ID","rs":"USP","rt":"USRAC","rc":"US_ID","o":1,"d":"NO ACTION"},{"fk":"FK_USRACOTPTYPE_TR_US","ps":"USP","pt":"USRACOTPTYPE","pc":"TR_US","rs":"USP","rt":"USRAC","rc":"US_ID","o":1,"d":"NO ACTION"},{"fk":"FK_USRACOTPTYPE_US_ID","ps":"USP","pt":"USRACOTPTYPE","pc":"US_ID","rs":"USP","rt":"USRAC","rc":"US_ID","o":1,"d":"NO ACTION"},{"fk":"FK_USRGROUPMEMBER_UG_ID","ps":"USP","pt":"USRGROUPMEMBER","pc":"UG_ID","rs":"USP","rt":"USRGROUP","rc":"UG_ID","o":1,"d":"CASCADE"},{"fk":"FK_USRGROUPMEMBER_US_ID","ps":"USP","pt":"USRGROUPMEMBER","pc":"US_ID","rs":"USP","rt":"USRAC","rc":"US_ID","o":1,"d":"CASCADE"},{"fk":"FK_USRPROFILE_LTR_US","ps":"USP","pt":"USRPROFILE","pc":"LTR_US","rs":"USP","rt":"USRAC","rc":"US_ID","o":1,"d":"NO ACTION"},{"fk":"FK_USRPROFILE_TR_US","ps":"USP","pt":"USRPROFILE","pc":"TR_US","rs":"USP","rt":"USRAC","rc":"US_ID","o":1,"d":"NO ACTION"},{"fk":"FK_USRPROFILE_US_ID","ps":"USP","pt":"USRPROFILE","pc":"US_ID","rs":"USP","rt":"USRAC","rc":"US_ID","o":1,"d":"NO ACTION"}]}</script>
<script>
(function(){
  "use strict";
  const DATA = JSON.parse(document.getElementById("DATA").textContent);
  const TABLES = DATA.tables, FKCOLS = DATA.fks;

  const key = (s,t) => s + "." + t;
  const byKey = new Map(TABLES.map(t => [key(t.s,t.t), t]));

  /* FK column rows arrive one per column. Group them back into whole constraints so a
     composite key reads as one join with two conditions, not two separate joins. */
  const FKS = [];
  {
    const m = new Map();
    for (const r of FKCOLS){
      const id = r.fk + "|" + r.ps + "." + r.pt;
      let f = m.get(id);
      if (!f){ f = { fk:r.fk, ps:r.ps, pt:r.pt, rs:r.rs, rt:r.rt, d:r.d, cols:[] }; m.set(id, f); FKS.push(f); }
      f.cols.push({ p:r.pc, r:r.rc });
    }
  }
  const out = new Map(), inn = new Map();
  for (const f of FKS){
    const a = key(f.ps,f.pt), b = key(f.rs,f.rt);
    if (!out.has(a)) out.set(a, []);  out.get(a).push(f);
    if (!inn.has(b)) inn.set(b, []);  inn.get(b).push(f);
  }
  /* Which of my columns is a foreign key, and to where. */
  const fkByCol = new Map();
  for (const f of FKS) for (const c of f.cols)
    fkByCol.set(key(f.ps,f.pt) + "." + c.p, { s:f.rs, t:f.rt, c:c.r });

  const SCHEMAS = [...new Set(TABLES.map(t => t.s))].sort();
  const isStm = t => /_STM$/.test(t.t);

  document.getElementById("cT").textContent = TABLES.length + " tables";
  document.getElementById("cC").textContent = TABLES.reduce((n,t)=>n+t.c.length,0).toLocaleString() + " columns";
  document.getElementById("cF").textContent = FKS.length + " relationships";
  document.getElementById("cS").textContent = SCHEMAS.length + " schemas";

  /* ── state ── */
  let active = null, filterSchema = null, query = "", tab = "fields";

  /* ── sidebar ── */
  const chipsEl = document.getElementById("chips");
  chipsEl.innerHTML = '<span class="chip on" data-s="">ALL</span>' +
    SCHEMAS.map(s => `<span class="chip" data-s="${s}">${s}</span>`).join("");
  chipsEl.addEventListener("click", e => {
    const c = e.target.closest(".chip"); if (!c) return;
    filterSchema = c.dataset.s || null;
    [...chipsEl.children].forEach(x => x.classList.toggle("on", x === c));
    renderList();
  });

  const listEl = document.getElementById("list");
  const qEl = document.getElementById("q");
  qEl.addEventListener("input", () => { query = qEl.value.trim().toUpperCase(); renderList(); });

  function matches(t){
    if (filterSchema && t.s !== filterSchema) return false;
    if (!query) return true;
    if ((t.s + "." + t.t).toUpperCase().includes(query)) return true;
    return t.c.some(c => c.n.toUpperCase().includes(query));
  }

  function renderList(){
    const hit = TABLES.filter(matches);
    let html = "", lastS = null;
    for (const t of hit){
      if (t.s !== lastS){ html += `<div class="grp">${t.s} &nbsp;<span style="opacity:.6">${hit.filter(x=>x.s===t.s).length}</span></div>`; lastS = t.s; }
      const k = key(t.s,t.t);
      html += `<div class="item${k===active?" on":""}${isStm(t)?" stm":""}" data-k="${k}">
                 <span class="nm">${t.t}</span><span class="ct">${t.c.length}</span></div>`;
    }
    listEl.innerHTML = html || `<div style="padding:28px 14px;text-align:center;color:var(--faint);font-size:.8rem">Nothing matches “${qEl.value}”.</div>`;
  }
  listEl.addEventListener("click", e => {
    const i = e.target.closest(".item"); if (!i) return;
    select(i.dataset.k);
  });

  /* ── SQL helpers ── */
  const alias = t => {
    const parts = t.split("_").filter(Boolean);
    let a = parts.length > 1 ? parts.map(p => p[0]).join("") : t.slice(0,3);
    return a.toUpperCase().slice(0,4);
  };
  const esc = s => String(s).replace(/[&<>]/g, m => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[m]));
  const kw = s => `<span class="kw">${s}</span>`;
  const cm = s => `<span class="cm">${s}</span>`;

  /* The join as you would actually write it. */
  function joinSql(f, dir){
    const pA = alias(f.pt), rA = alias(f.rt);
    const a2 = pA === rA ? rA + "2" : rA;
    const on = f.cols.map(c => `${pA}.[${c.p}] = ${a2}.[${c.r}]`).join("\n       AND ");
    if (dir === "out"){
      return kw("SELECT") + ` *\n` +
             kw("FROM") + `   [${f.ps}].[${f.pt}]   ${pA} ` + kw("WITH(NOLOCK)") + `\n` +
             kw("JOIN") + `   [${f.rs}].[${f.rt}]   ${a2} ` + kw("WITH(NOLOCK)") + `\n` +
             `  ` + kw("ON") + `   ${on}`;
    }
    return kw("SELECT") + ` *\n` +
           kw("FROM") + `   [${f.rs}].[${f.rt}]   ${a2} ` + kw("WITH(NOLOCK)") + `\n` +
           kw("LEFT JOIN") + ` [${f.ps}].[${f.pt}]   ${pA} ` + kw("WITH(NOLOCK)") + `\n` +
           `  ` + kw("ON") + `   ${on}`;
  }

  /* ── main render ── */
  function select(k){
    active = k; tab = "fields";
    renderList();
    render();
    document.querySelector(".main").scrollIntoView({ block:"start", behavior:"smooth" });
  }

  function render(){
    const main = document.getElementById("main");
    if (!active){ main.innerHTML = welcome(); return; }
    const t = byKey.get(active);
    if (!t){ main.innerHTML = welcome(); return; }

    const o = out.get(active) || [], i = inn.get(active) || [];
    main.innerHTML =
      `<div class="card">
         <h2><span class="q">${t.s}.${t.t}</span>
             ${isStm(t) ? '<span class="badge b-stm">AUDIT TWIN</span>' : ""}
             <small>${t.c.length} columns · ${o.length} out · ${i.length} in</small></h2>
         <div class="tabs">
           <div class="tab${tab==="fields"?" on":""}" data-t="fields">Fields</div>
           <div class="tab${tab==="out"?" on":""}" data-t="out">Joins out (${o.length})</div>
           <div class="tab${tab==="in"?" on":""}" data-t="in">Joined from (${i.length})</div>
           <div class="tab${tab==="ddl"?" on":""}" data-t="ddl">Starter query</div>
         </div>
         <div class="body">${
            tab==="fields" ? fieldsHtml(t)
          : tab==="out"    ? joinsHtml(o, "out", t)
          : tab==="in"     ? joinsHtml(i, "in",  t)
          :                  ddlHtml(t, o)
         }</div>
       </div>`;

    main.querySelectorAll(".tab").forEach(el => el.addEventListener("click", () => { tab = el.dataset.t; render(); }));
    main.querySelectorAll("a[data-go]").forEach(a =>
      a.addEventListener("click", e => { e.preventDefault(); select(a.dataset.go); }));
    main.querySelectorAll(".copy").forEach(b =>
      b.addEventListener("click", () => {
        navigator.clipboard?.writeText(b.parentElement.querySelector("pre").innerText);
        const was = b.textContent; b.textContent = "copied"; setTimeout(()=>b.textContent=was, 1200);
      }));
  }

  function fieldsHtml(t){
    const rows = t.c.map(c => {
      const ref = fkByCol.get(key(t.s,t.t) + "." + c.n);
      return `<tr>
        <td class="col">${c.k ? '<span class="badge b-pk">PK</span> ' : ""}${ref ? '<span class="badge b-fk">FK</span> ' : ""}${esc(c.n)}</td>
        <td class="typ">${esc(c.t)}</td>
        <td>${c.z ? '<span class="nul">null</span>' : '<span class="req">NOT NULL</span>'}</td>
        <td class="ref">${ref
            ? `→ <a href="#" data-go="${ref.s}.${ref.t}">${ref.s}.${ref.t}</a>.${ref.c}`
            : ""}</td></tr>`;
    }).join("");
    return `<table><thead><tr><th style="width:34%">Column</th><th style="width:18%">Type</th>
            <th style="width:14%">Null</th><th>Ties to</th></tr></thead><tbody>${rows}</tbody></table>`;
  }

  function joinsHtml(list, dir, t){
    if (!list.length) return `<div class="empty">No relationship in this direction.</div>`;
    return `<div class="joins">` + list.map(f => {
      const other = dir === "out" ? `${f.rs}.${f.rt}` : `${f.ps}.${f.pt}`;
      const label = dir === "out"
        ? `each row points at one <b>${other}</b>`
        : `<b>${other}</b> points back at this`;
      return `<div class="join">
        <h4>${label} &nbsp;<span style="color:var(--faint);font-weight:400">${f.fk}${f.d!=="NO ACTION"?` · ON DELETE ${f.d}`:""}</span></h4>
        <button class="copy">copy</button>
        <pre>${joinSql(f, dir)}</pre>
      </div>`;
    }).join("") + `</div>`;
  }

  /* A query that already joins in every parent, so you start from something that runs. */
  function ddlHtml(t, o){
    const a = alias(t.t);
    const used = new Set([a]);
    const lines = [];
    const sel = ["  " + a + ".*"];
    for (const f of o){
      let x = alias(f.rt), n = 2;
      while (used.has(x)) x = alias(f.rt) + (n++);
      used.add(x);
      const on = f.cols.map(c => `${a}.[${c.p}] = ${x}.[${c.r}]`).join(" AND ");
      lines.push(`${kw("LEFT JOIN")} [${f.rs}].[${f.rt}] ${x} ${kw("WITH(NOLOCK)")}\n       ${kw("ON")} ${on}`);
    }
    const hasLtr = t.c.some(c => c.n === "LTR_STS");
    const body =
      kw("SELECT") + `\n${sel.join(",\n")}\n` +
      kw("FROM") + `   [${t.s}].[${t.t}] ${a} ` + kw("WITH(NOLOCK)") + `\n` +
      lines.join("\n") +
      (hasLtr ? `\n` + kw("WHERE") + `  ${a}.[LTR_STS] = N'NORMAL'   ` + cm("-- soft delete: live rows only") : "");
    return `<div class="pad"><button class="copy">copy</button>
            <div style="font-size:.8rem;color:var(--muted);margin-bottom:9px">
              Every parent already joined in, left-joined so a null key does not drop the row.</div>
            <pre>${body}</pre></div>`;
  }

  function welcome(){
    /* Biggest hubs first - the tables most worth understanding. */
    const hubs = [...inn.entries()].map(([k,v]) => ({ k, n:v.length }))
                  .sort((a,b) => b.n - a.n).slice(0, 12);
    const rows = FKS.map(f => `<tr>
        <td><a href="#" data-go="${f.ps}.${f.pt}">${f.ps}.${f.pt}</a></td>
        <td style="color:var(--faint)">→</td>
        <td><a href="#" data-go="${f.rs}.${f.rt}">${f.rs}.${f.rt}</a></td>
        <td class="sql">ON ${f.cols.map(c => `${f.pt}.${c.p} = ${f.rt}.${c.r}`).join(" AND ")}</td>
      </tr>`).join("");
    return `
      <div class="card">
        <h2>Start anywhere</h2>
        <div class="pad" style="color:var(--muted);font-size:.87rem">
          Pick a table on the left, or search for a column name to find every table that
          carries it. Each table shows its fields, what it points at, what points back at
          it, and a starter query with the joins already written.
        </div>
      </div>

      <div class="card">
        <h2>The hubs <small>tables the most other tables point at</small></h2>
        <table><thead><tr><th>Table</th><th style="width:28%">Referenced by</th></tr></thead><tbody>
        ${hubs.map(h => `<tr><td class="col"><a href="#" data-go="${h.k}">${h.k}</a></td>
                             <td>${h.n} table${h.n===1?"":"s"}</td></tr>`).join("")}
        </tbody></table>
      </div>

      <div class="card">
        <h2>Every relationship <small>all ${FKS.length}, as join conditions</small></h2>
        <table class="allrel"><thead><tr><th style="width:24%">Child</th><th></th>
          <th style="width:24%">Parent</th><th>Tied on</th></tr></thead>
          <tbody>${rows}</tbody></table>
      </div>`;
  }

  /* delegate navigation on the welcome screen too */
  document.getElementById("main").addEventListener("click", e => {
    const a = e.target.closest("a[data-go]");
    if (a){ e.preventDefault(); select(a.dataset.go); }
  });

  renderList();
  render();
})();
</script>
</body>
</html>
